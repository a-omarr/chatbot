<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Among Us Crewmate pointer (hand/click) cursor -->
  <!-- Body -->
  <ellipse cx="16" cy="19" rx="9" ry="11" fill="#1d953f"/>
  <!-- Visor -->
  <ellipse cx="20" cy="14" rx="6" ry="4" fill="#39d2e2"/>
  <ellipse cx="20" cy="14" rx="6" ry="4" fill="url(#visorShine2)" opacity="0.4"/>
  <!-- Backpack -->
  <rect x="5" y="13" width="4" height="10" rx="2" fill="#146b2e"/>
  <!-- Legs -->
  <rect x="10" y="27" width="4" height="5" rx="1" fill="#1d953f"/>
  <rect x="18" y="27" width="4" height="5" rx="1" fill="#1d953f"/>
  <!-- Hand pointing -->
  <rect x="24" y="18" width="7" height="3" rx="1.5" fill="#1d953f"/>
  <defs>
    <linearGradient id="visorShine2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
